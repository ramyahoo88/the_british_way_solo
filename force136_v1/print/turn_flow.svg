<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f3a22"/></marker>
    <style>
      .box{fill:#f6f2e2;stroke:#2f3a22;stroke-width:1.3}
      .dark{fill:#2f3a22;stroke:#2f3a22}
      .dec{fill:#fff;stroke:#7a2618;stroke-width:1.3}
      .t{font-size:10.5px;fill:#1e1f1a}
      .tb{font-size:10.5px;font-weight:700;fill:#1e1f1a}
      .tw{font-size:10.5px;font-weight:700;fill:#efe9cf}
      .s{font-size:9px;fill:#5d6152}
      .lab{font-size:9px;font-weight:700;fill:#7a2618}
      .ln{stroke:#2f3a22;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="box" x="70" y="6" width="200" height="30" rx="4"/>
  <text class="t" x="170" y="19" text-anchor="middle">Card revealed: MPAJA icon,</text>
  <text class="t" x="170" y="31" text-anchor="middle">then any Mandatory Event</text>
  <path class="ln" d="M170 36 V52"/>
  <rect class="dark" x="70" y="53" width="200" height="24" rx="4"/>
  <text class="tw" x="170" y="69" text-anchor="middle">Force 136 acts: draw a Directive</text>
  <path class="ln" d="M170 77 V93"/>
  <polygon class="dec" points="170,94 252,116 170,138 88,116"/>
  <text class="tb" x="170" y="113" text-anchor="middle">Op &amp; SA box</text>
  <text class="tb" x="170" y="125" text-anchor="middle">free?</text>
  <path class="ln" d="M170 138 V156"/>
  <text class="lab" x="176" y="150">yes</text>
  <rect class="box" x="8" y="157" width="292" height="44" rx="4"/>
  <text class="tb" x="154" y="172" text-anchor="middle">Op &amp; SA: PLACE › card goals › CONTACT</text>
  <text class="s" x="154" y="185" text-anchor="middle">first goal that qualifies; resolve the Operation,</text>
  <text class="s" x="154" y="196" text-anchor="middle">then the first Special Activity that would do something</text>
  <path class="ln" d="M252 116 H324 V229 H259"/>
  <text class="lab" x="262" y="111">no</text>
  <rect class="box" x="82" y="214" width="176" height="30" rx="4"/>
  <text class="tb" x="170" y="227" text-anchor="middle">Limited: PLACE › card's</text>
  <text class="tb" x="170" y="239" text-anchor="middle">AMBUSH/TRAIN pair › CONTACT</text>
  <path class="ln" d="M170 244 V262"/>
  <text class="s" x="176" y="256">nothing qualifies</text>
  <rect class="box" x="96" y="263" width="148" height="22" rx="4"/>
  <text class="t" x="170" y="278" text-anchor="middle">Pass in the leftmost free box</text>
  <text class="s" x="10" y="296">Never execute the Event. Discard the Directive after the turn.</text>
</svg>
