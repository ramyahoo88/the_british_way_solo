<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 372" width="340" height="372" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f3a22"/></marker>
    <style>
      .box{fill:#f6f2e2;stroke:#2f3a22;stroke-width:1.3}
      .dark{fill:#2f3a22;stroke:#2f3a22}
      .dec{fill:#fff;stroke:#7a2618;stroke-width:1.3}
      .t{font-size:10.5px;fill:#1e1f1a}
      .tb{font-size:10.5px;font-weight:700;fill:#1e1f1a}
      .tw{font-size:10.5px;font-weight:700;fill:#efe9cf}
      .s{font-size:9px;fill:#5d6152}
      .lab{font-size:9px;font-weight:700;fill:#7a2618}
      .ln{stroke:#2f3a22;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect class="box" x="40" y="6" width="200" height="30" rx="4"/>
  <text class="t" x="140" y="19" text-anchor="middle">Card revealed: MPAJA icon,</text>
  <text class="t" x="140" y="31" text-anchor="middle">then any Mandatory Event</text>
  <path class="ln" d="M140 36 V52"/>
  <rect class="dark" x="40" y="53" width="200" height="24" rx="4"/>
  <text class="tw" x="140" y="69" text-anchor="middle">Force 136 acts: draw a Directive</text>
  <path class="ln" d="M140 77 V91"/>
  <rect class="dec" x="27" y="92" width="226" height="46" rx="10"/>
  <text class="tb" x="140" y="106" text-anchor="middle">J4 or J25, Japan already acted,</text>
  <text class="t" x="140" y="119" text-anchor="middle">the Event box is free, and the</text>
  <text class="t" x="140" y="131" text-anchor="middle">British side would do something?</text>
  <path class="ln" d="M253 115 H270"/>
  <text class="lab" x="254" y="110">yes</text>
  <rect class="box" x="271" y="92" width="65" height="46" rx="4"/>
  <text class="tb" x="303" y="108" text-anchor="middle">Event box</text>
  <text class="s" x="303" y="120" text-anchor="middle">British side</text>
  <text class="s" x="303" y="131" text-anchor="middle">(step 2)</text>
  <path class="ln" d="M140 138 V156"/>
  <text class="lab" x="146" y="150">no</text>
  <polygon class="dec" points="140,157 222,179 140,201 58,179"/>
  <text class="tb" x="140" y="176" text-anchor="middle">Op &amp; SA box</text>
  <text class="tb" x="140" y="188" text-anchor="middle">free?</text>
  <path class="ln" d="M140 201 V219"/>
  <text class="lab" x="146" y="213">yes</text>
  <rect class="box" x="8" y="220" width="264" height="44" rx="4"/>
  <text class="tb" x="140" y="235" text-anchor="middle">Op &amp; SA: PLACE › card goals › CONTACT</text>
  <text class="s" x="140" y="248" text-anchor="middle">first goal that qualifies; resolve the Operation,</text>
  <text class="s" x="140" y="259" text-anchor="middle">then the first Special Activity that would do something</text>
  <path class="ln" d="M222 179 H324 V292 H229"/>
  <text class="lab" x="232" y="174">no</text>
  <rect class="box" x="52" y="277" width="176" height="30" rx="4"/>
  <text class="tb" x="140" y="290" text-anchor="middle">Limited: PLACE › card's</text>
  <text class="tb" x="140" y="302" text-anchor="middle">AMBUSH/TRAIN pair › CONTACT</text>
  <path class="ln" d="M140 307 V325"/>
  <text class="s" x="146" y="319">nothing qualifies</text>
  <rect class="box" x="66" y="326" width="148" height="22" rx="4"/>
  <text class="t" x="140" y="341" text-anchor="middle">Pass in the leftmost free box</text>
  <text class="s" x="10" y="366">Otherwise never execute the Event. Discard the Directive after the turn.</text>
</svg>
